name: Enterprise QA Automation Pipeline

# Trigger this pipeline every time code is pushed to the 'main' branch
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-suite:
    runs-on: ubuntu-latest  # Spin up a clean Linux server in the cloud

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Set Up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Framework Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Install Playwright System Dependencies
      run: |
        playwright install-deps
    
    - name: Install Playwright Browser Binaries
      run: |
        playwright install
        
    - name: Initialize Playwright Test Browsers
      run: playwright install chromium

    - name: Execute Automated Enterprise Suite
      run: python -m pytest

