[pytest]
pythonpath = .
markers =
    smoke: Critical path tests that must pass before any deployment.
    api: Backend API network validation tests.
    regression: Complete end-to-end user path validation suites.

filterwarnings =
    ignore::DeprecationWarning
# Automatically forces clean terminal logs, runs in headless browser mode by default, 
# and compiles our self-contained HTML visual report without forcing long terminal inputs.
addopts = --html=tests/report.html --self-contained-html -v -s

# Configures the default directories for Pytest to scan for test executions
testpaths = tests

# Standardizes console logging output formats for debugging execution loops
log_cli = true
log_cli_level = INFO
log_cli_format = %%(asctime)s [%%(levelname)s] %%(message)s (%%(filename)s:%%(lineno)s)
log_cli_date_format = %%Y-%%m-%%d %%H:%%M:%%S

